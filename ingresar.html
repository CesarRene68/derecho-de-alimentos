<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Acceso al panel | Derecho de Alimentos</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      try {
        if (localStorage.getItem('tema') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#202124');
        }
      } catch (error) {
        /* Sin almacenamiento: se mantiene el tema claro. */
      }
    })();
  </script>

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body">
  <a class="salto-contenido" href="#campo-clave">Saltar a la contraseña</a>

  <header class="cabecera">
    <div class="contenedor cabecera__interior">
      <h1 class="marca">
        <a href="index.html" aria-label="Derecho de Alimentos, ir al inicio">
          DERECHO DE ALIMENTOS
        </a>
      </h1>

      <button class="boton-tema" id="boton-tema" type="button"
              aria-label="Activar tema oscuro" title="Cambiar a tema oscuro">
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="login-principal contenedor">
    <section class="login-panel" aria-labelledby="login-titulo">
      <h2 class="login-titulo" id="login-titulo">Acceso al panel</h2>
      <p class="login-subtitulo">
        Esta zona permite publicar y editar el contenido del buscador.
      </p>

      <form class="login-form" id="form-ingresar">
        <input id="login-next" name="next" type="hidden" value="/admin/">

        <label class="admin-etiqueta" for="campo-clave">Contraseña</label>
        <input
          class="admin-campo"
          id="campo-clave"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          autofocus
        >

        <div class="admin-acciones">
          <button class="admin-boton" id="login-enviar" type="submit">
            Iniciar sesión
          </button>
        </div>

        <p class="admin-estado" id="login-estado" role="status" aria-live="polite"></p>
      </form>

      <a class="login-volver" href="index.html">← Volver al buscador</a>
    </section>
  </main>

  <script src="js/tema.js"></script>
  <script src="js/ingresar.js"></script>
</body>
</html>
